<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vera · Clover assistant mode</title>
<!-- Assistant mode: an agentic demo for the Clover dashboard.

     It opens on Clover Home: Vera's brief on top with "Open Vera" (the one
     filled button), and "Ask Vera" chips under the snapshot, item sales and
     finances. Open Vera enters the mode:

     Three states, each with its own shape:
       1  Today (home)        one centred column, max 720
       2  Chat                one centred column, max 720
       3  Chat + Clover page  chat 38% left, the real Clover page right
     There is never an empty right column.

     The Clover top bar stays in every state; only the left nav collapses.
     The right column is the real dashboard page under a slim window header
     (breadcrumb, Open full page, close). The selected card's tint is
     shared with a 3px bar on that header and the highlighted cells.

     Story: slide 10 of the vision deck, five stops in a fixed order
     (7:02, 10:04, 2:03, 4:05, 9:02 pm). The stepper sets the world at each
     stop (clock, Home, Today, thread, badge): stop 1 lands on Home, stops
     2–5 on Today; the
     presenter performs every human action. Nothing opens by itself.
     Stepper: the "1 / 5" pill bottom-right of the screen, ArrowLeft and
     ArrowRight, or 1–5. It hides after 3 s without pointer movement.
     URL: ?stop=1..5 starts at a stop.

     Design system: styles.css (Graphik, Dash 3.0 type scale, tokens,
     iPad bezel + scaled 1280x834 canvas). Below 1024px the bezel drops away
     and the page opens as a sheet. -->
<link rel="stylesheet" href="styles.css">
<style>
/* ===========================================================================
   Assistant mode — additions on top of styles.css (all prefixed am-)
   =========================================================================== */
:root {
  --accent:      var(--green);
  --accent-ink:  var(--green-ink);
  /* The selected card. Same tint as the dashboard's selected nav item, and
     the same tint on the page window's edge bar and highlighted cells. */
  --am-selected: var(--nav-active);
  --am-warn-tint: #FBE7BC;
  --am-warn-ink:  #6B4A0E;
  --am-quiet:     #EDEFF1;
  --am-hover:     #F1F3F4;
  --am-bar:       #DADCE0;
  --am-scrim:     rgba(32, 33, 36, 0.32);
  --am-rule:      rgba(31, 33, 36, 0.16);
  --am-col:       720px;     /* States 1 and 2 */
  --am-split:     38%;       /* State 3 chat column */
  /* Home: Clover's plum for money moments, and the chart/bar series. */
  --am-plum:      #2E2257;
  --am-plum-tint: #E4DDF7;
  --am-lilac:     #CBC0F2;
  --am-blue:      #2B8CD8;
  --am-violet:    #8C6CE0;
  --am-up:        var(--green-tx);
  --am-down:      #C5221F;
  --am-alert-tint: #FCE8E6;
  --am-alert-ink:  #A50E0E;
}

[hidden] { display: none !important; }
.am-ico { display: block; flex: 0 0 auto; }
svg.am-ico { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.am-num { font-variant-numeric: tabular-nums; }

/* ---------- controls ---------- */
.btn { gap: var(--sp-2); white-space: nowrap; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.am-link {
  display: inline; padding: 0;
  font: inherit; color: var(--ink);
  cursor: pointer;
  text-decoration: none; text-underline-offset: 3px;
  border-radius: 4px;
}
.am-link:hover { text-decoration: underline; }
.am-link:focus-visible, .am-textbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.am-textbtn {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  height: var(--hit); padding: 0 var(--sp-3);
  border-radius: var(--sp-2);
  font: var(--label); color: var(--ink);
  cursor: pointer;
  text-underline-offset: 3px;
}
.am-textbtn:hover { text-decoration: underline; }

.am-iconbtn {
  position: relative;
  width: var(--hit); height: var(--hit);
  display: grid; place-items: center;
  border-radius: var(--sp-2);
  color: var(--ink-2);
  cursor: pointer;
  transition: background 160ms ease;
}
.am-iconbtn:hover { background: var(--am-hover); }
.am-iconbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.am-iconbtn img { width: var(--icon); height: var(--icon); }

@keyframes am-win-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes am-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes am-cell-pulse { 0%, 100% { background: var(--nav-active); } 50% { background: var(--green-tint); } }
/* The working line's dots: each is lit for a third of the 900 ms loop. */
@keyframes am-dot { 0% { opacity: 1; } 33.333%, 100% { opacity: 0.25; } }

/* Agent output arrives with styles.css's drop keyframe, 60 ms apart. */
.am-drop { animation: drop var(--dur) var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms + var(--d, 0ms)); }

.am-tag { display: inline-flex; align-items: center; padding: 2px var(--sp-2); border-radius: 6px; background: var(--am-quiet); color: var(--ink-2); font: var(--caption-bold); white-space: nowrap; }
.am-tag--warn { background: var(--am-warn-tint); color: var(--am-warn-ink); }

/* ---------- Clover top bar (all views) ---------- */
.navbtn--pill:hover { background: var(--am-hover); }
.navbtn--pill.is-active { background: var(--nav-active); }
.am-badge {
  min-width: 20px; height: 20px; padding: 0 6px;
  display: inline-grid; place-items: center;
  border-radius: 999px;
  background: var(--accent); color: #fff;
  font: var(--caption-bold); font-variant-numeric: tabular-nums;
  margin-left: calc(var(--sp-1) * -1);
}
.railbtn:focus-visible, .navbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.railbtn.is-inert, .navbtn.is-inert { cursor: default; }

/* The top bar now sits outside the scroller, so the rail and the corner
   mask pin to the top of the scroller rather than under the bar. */
#viewA .rail { top: 0; }
#viewA .main::before { top: 0; }

/* ---------- breadcrumb ---------- */
.am-crumb { display: flex; align-items: center; gap: var(--sp-1); min-width: 0; font: var(--label); }
.am-crumb-part { color: var(--muted); white-space: nowrap; }
.am-crumb-part.is-current { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.am-crumb-sep { width: 16px; height: 16px; opacity: 0.55; }
.am-dash-crumb { padding: var(--sp-6) 0 0; }

/* ===========================================================================
   Clover pages — one set of renderers for the dashboard and the window.
   Each keeps its own title, pill actions, segmented control and date nav.
   =========================================================================== */
.am-page-body { display: flex; flex-direction: column; gap: var(--sp-4); }

.am-ptop { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); margin-top: var(--sp-4); }
.am-ptitle { font: var(--heading-01); margin: 0; }
.am-pmeta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); font: var(--caption); color: var(--muted); margin-top: var(--sp-1); }
.am-pactions { display: flex; align-items: center; gap: var(--sp-2); flex: 0 0 auto; padding-top: var(--sp-1); }
.am-pill {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  height: 32px; padding: 0 var(--sp-3);
  border-radius: 999px;
  background: var(--am-quiet); color: var(--ink);
  font: var(--caption-bold);
  cursor: pointer; white-space: nowrap;
}
.am-pill:hover { background: var(--line); }
.am-pill--filled { background: var(--green); color: #fff; }
.am-pill--filled:hover { background: var(--green-dk); }
.am-pill img { width: 16px; height: 16px; }
.am-pcontrols { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-3); }
.am-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--am-quiet); }
.am-seg button { height: 28px; padding: 0 var(--sp-3); border-radius: 999px; font: var(--caption-bold); color: var(--muted); cursor: pointer; white-space: nowrap; }
.am-seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, 0.10); }
.am-seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.am-datenav { display: inline-flex; align-items: center; height: 32px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
.am-datenav button { width: 32px; height: 30px; display: grid; place-items: center; border-radius: 999px; cursor: pointer; }
.am-datenav button:hover { background: var(--am-hover); }
.am-datenav button img { width: 16px; height: 16px; }
.am-datenav span { font: var(--caption-bold); color: var(--ink); padding: 0 var(--sp-1); white-space: nowrap; }

.am-card { padding: var(--sp-6); }
.am-card .card-head { margin-bottom: var(--sp-3); }
.am-card .card-title { margin: 0; }

.am-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.am-card-chart { margin-top: var(--sp-4); }
.am-tile { background: var(--soft); border-radius: var(--sp-3); padding: var(--sp-4); }
.am-tile-label { font: var(--caption); color: var(--muted); }
.am-tile-value { font: var(--heading-02); color: var(--ink); margin-top: var(--sp-1); font-variant-numeric: tabular-nums; }
.am-tile-note { font: var(--caption); color: var(--muted); margin-top: 2px; }

.am-chart { display: flex; align-items: stretch; gap: var(--sp-2); height: 144px; }
.am-bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: var(--sp-1); }
.am-bar-val { font: var(--caption); color: var(--muted); font-variant-numeric: tabular-nums; }
.am-bar { width: 100%; max-width: 40px; border-radius: 4px 4px 0 0; background: var(--am-bar); }
.am-bar.is-recent { background: var(--faint); }
.am-chart-days { display: flex; gap: var(--sp-2); padding-top: var(--sp-2); border-top: 1px solid var(--line); }
.am-chart-days span { flex: 1 1 0; text-align: center; font: var(--caption); color: var(--faint); }

.am-grid-wrap { overflow-x: auto; margin: 0 calc(var(--sp-6) * -1); padding: 0 var(--sp-6); }
.am-table { width: 100%; border-collapse: collapse; }
.am-table th { font: var(--caption); color: var(--muted); text-align: left; white-space: nowrap; padding: var(--sp-2); border-bottom: 1px solid var(--line); }
.am-table td { font: var(--body); color: var(--ink); white-space: nowrap; height: 56px; padding: var(--sp-2); border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
.am-table tbody tr:last-child td { border-bottom: 0; }
.am-table th:first-child, .am-table td:first-child { padding-left: 0; }
.am-table th:last-child, .am-table td:last-child { padding-right: 0; }
.am-table .am-num { text-align: right; }
.am-table tfoot td { font: var(--body-bold); border-top: 1px solid var(--line); border-bottom: 0; }
.am-table td.am-hl:first-child, .am-table td.am-hl-warn:first-child { padding-left: var(--sp-2); }
.am-table td.am-hl:last-child { padding-right: var(--sp-2); }
.am-sched { min-width: 600px; }
.am-sched td { font: var(--caption); }
.am-sched td:first-child { font: var(--caption-bold); }
.am-sched th:last-child, .am-sched td:last-child { text-align: right; }
.am-sched th:first-child, .am-sched td:first-child { position: sticky; left: 0; z-index: 1; background: #fff; padding-right: var(--sp-3); }
.am-table .is-over { color: var(--am-warn-ink); }
/* Expandable rows, as Clover's tables do them: a chevron in the first cell,
   and the detail as a row of the same height, indented to the text. */
.am-table svg.am-xchev { display: inline-block; vertical-align: -3px; margin-right: var(--sp-1); color: var(--faint); }
.am-sub td { height: 56px; font: var(--caption); color: var(--ink-2); white-space: normal; }
.am-evidence { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); padding-left: 20px; }
.am-evidence-label { color: var(--muted); margin-right: var(--sp-1); }

/* The highlighted draft: the selected card's tint. Sick is a status, so it
   keeps the dashboard's warning tint. */
.am-hl      { background: var(--am-selected); }
.am-hl-warn { background: var(--am-warn-tint); }
.am-sched td.am-hl, .am-sched td.am-hl-warn { padding-left: var(--sp-2); padding-right: var(--sp-2); }
.am-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.am-cell-label { font: var(--caption-bold); color: var(--accent-ink); }
.am-hl-warn .am-cell-label { color: var(--am-warn-ink); }
.am-time-edit { display: flex; align-items: center; gap: var(--sp-1); }

.am-select, .am-qty {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: var(--sp-2);
  background: #fff;
  font: var(--caption); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.am-select { padding: 0 var(--sp-1); }
.am-qty { width: 64px; height: var(--hit); padding: 0 var(--sp-3); font: var(--body); text-align: right; -moz-appearance: textfield; }
.am-qty::-webkit-outer-spin-button, .am-qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.am-select:focus, .am-qty:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.am-inline-field { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); font: var(--body); color: var(--ink); }
.am-inline-field > span:first-child { font: var(--caption); color: var(--muted); min-width: 64px; }
.am-inline-field .am-select { height: var(--hit); font: var(--body); padding: 0 var(--sp-2); }
.card-head .am-inline-field { margin: 0; }
.card-title .am-tag { vertical-align: 3px; margin-left: var(--sp-1); }

/* Unrelated rows and summary cards while a draft is open. */
.am-dimmed *, .am-table tr.is-dim td { color: var(--muted) !important; }
.am-dimmed .am-bar { opacity: 0.5; }
.am-table tr.is-dim td:first-child { font-weight: 400; }

/* ===========================================================================
   Clover Home — where the demo lands. Vera's brief sits at the top, with
   the way into the assistant mode; "Ask Vera" strips sit under cards.
   =========================================================================== */
.am-search {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 320px; height: var(--hit);
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 0 var(--sp-3);
  border: 1px solid var(--line); border-radius: 999px;
  background: #fff; color: var(--faint);
  font: var(--body); text-align: left;
  cursor: default;
}
.am-vera-ico { color: var(--green-tx); }

.am-home { display: flex; flex-direction: column; gap: var(--sp-6); padding-top: var(--sp-6); }
.am-home-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.am-home-title { font: var(--heading-01); }
.am-range {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  height: var(--hit); padding: 0 var(--sp-3);
  border: 1px solid var(--line); border-radius: var(--sp-2);
  background: #fff; color: var(--muted); font: var(--caption);
  cursor: pointer;
}
.am-hgrid { display: grid; gap: var(--sp-6); align-items: stretch; }
.am-hgrid--2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.am-hgrid--1-1 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.am-hcard { display: flex; flex-direction: column; gap: var(--sp-4); padding: var(--sp-6); }
.am-hcard-title { display: inline-flex; align-items: center; gap: 2px; font: var(--heading-04); color: var(--ink); }
.am-hcard-title svg { color: var(--ink-2); }
.am-hcard-sub { font: var(--caption); color: var(--muted); margin-top: calc(var(--sp-3) * -1); }
.am-hblock { display: flex; flex-direction: column; gap: var(--sp-3); }
.am-hsec { display: flex; flex-direction: column; gap: var(--sp-1); }
.am-hsec-title { font: var(--heading-04); }
.am-hsec-sub { font: var(--caption); color: var(--muted); }
.am-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.am-pager { display: inline-flex; align-items: center; gap: var(--sp-1); font: var(--caption); color: var(--muted); white-space: nowrap; }
.am-pager svg { color: var(--faint); }

/* Vera's brief */
.am-hbrief { display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: var(--sp-4); padding: var(--sp-6); }
.am-vera-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--nav-active); color: var(--green-tx); }
.am-hbrief-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-4); }
.am-hbrief-title { font: var(--heading-04); }
.am-hbrief-meta { font: var(--caption); color: var(--muted); white-space: nowrap; }
.am-hbrief-text { margin-top: var(--sp-1); font: var(--body); color: var(--ink-2); max-width: 760px; }
.am-hbrief-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); margin-top: var(--sp-4); }
.am-hbrief-needs { font: var(--body-bold); color: var(--ink); }
.am-hbrief-needs.is-none { font: var(--body); color: var(--muted); }

/* Business snapshot */
.am-tabs { display: flex; gap: var(--sp-1); }
.am-tabs button { height: 32px; padding: 0 var(--sp-3); border-radius: var(--sp-2); font: var(--caption-bold); color: var(--muted); cursor: pointer; }
.am-tabs button[aria-pressed="true"] { background: var(--nav-active); color: var(--green-ink); }
.am-figrow { display: flex; gap: var(--sp-10); }
.am-fig-label { font: var(--caption); color: var(--muted); }
.am-fig-value { font: var(--heading-02); color: var(--ink); font-variant-numeric: tabular-nums; }
.am-legend { display: flex; gap: var(--sp-4); font: var(--caption); color: var(--muted); }
.am-legend span { display: inline-flex; align-items: center; gap: var(--sp-1); }
.am-legend span::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.am-legend span + span::before { background: var(--faint); }
.am-spark { display: block; width: 100%; height: auto; overflow: visible; }
.am-spark text { stroke: none; fill: var(--faint); font: var(--caption); font-size: 12px; font-variant-numeric: tabular-nums; }
.am-spark .grid { stroke: var(--line-soft); stroke-width: 1; }
.am-spark .last { stroke: var(--faint); stroke-width: 1.5; stroke-dasharray: 3 4; }
.am-spark .this { stroke: var(--green); stroke-width: 2; }
.am-spark .area { stroke: none; fill: url(#amSparkFill); }
.am-spark .dot { fill: #fff; stroke: var(--green); stroke-width: 2; }

/* Ask Vera strip */
.am-askvera { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-top: auto; padding: var(--sp-2) var(--sp-3); border-radius: var(--sp-3); background: var(--soft); }
.am-askvera-label { display: inline-flex; align-items: center; gap: var(--sp-1); font: var(--caption-bold); color: var(--ink); }
.am-askvera-label svg { color: var(--green-tx); }
.am-vchip {
  height: 28px; padding: 0 var(--sp-3);
  border-radius: 999px; box-shadow: inset 0 0 0 1px var(--green);
  background: #fff; color: var(--ink); font: var(--caption);
  cursor: pointer; white-space: nowrap;
}
.am-vchip:hover { background: var(--green-tint); }
.am-vchip:focus-visible, .am-range:focus-visible, .am-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Notifications */
.am-notes { list-style: none; margin: 0; padding: 0; }
.am-note { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-soft); }
.am-note:first-child { padding-top: 0; }
.am-note-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); }
.am-note-tag { padding: 2px var(--sp-2); border-radius: 999px; background: var(--am-alert-tint); color: var(--am-alert-ink); font: var(--caption-bold); font-size: 12px; line-height: 16px; }
.am-note-title { font: var(--caption-bold); color: var(--ink); }
.am-note-time { font: var(--caption); font-size: 12px; line-height: 16px; color: var(--muted); }
.am-note > svg { color: var(--ink-2); }
.am-hcard > .btn-text { align-self: flex-start; margin-top: auto; }

/* Open batch */
.am-batch { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-4) var(--sp-6); border-radius: var(--sp-4); background: var(--am-plum); color: #fff; }
.am-batch-title { font: var(--body-bold); }
.am-batch-sub { font: var(--caption); color: rgba(255, 255, 255, 0.78); }
.am-btn-plum { background: var(--am-plum-tint); color: var(--am-plum); }
.am-btn-plum:hover { background: #fff; }

/* Capital */
.am-capital { display: grid; grid-template-columns: 136px minmax(0, 1fr); overflow: hidden; }
.am-capital-art { position: relative; background: var(--am-lilac); }
.am-capital-art i { position: absolute; bottom: 36%; width: 16px; border-radius: 3px 3px 0 0; background: #fff; box-shadow: 4px 0 0 var(--am-violet); }
.am-capital-art i:nth-child(1) { left: 36px; height: 24px; }
.am-capital-art i:nth-child(2) { left: 60px; height: 40px; }
.am-capital-art i:nth-child(3) { left: 84px; height: 56px; }
.am-capital-art b { position: absolute; left: 28px; top: 26%; width: 72px; height: 36px; border-radius: 18px; background: rgba(255, 255, 255, 0.72); }
.am-capital-body { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-6); }
.am-capital-head { display: flex; justify-content: space-between; gap: var(--sp-3); }
.am-capital-title { font: var(--body-bold); color: var(--ink); }
.am-capital-text { font: var(--caption); color: var(--muted); }
.am-hactions { display: flex; align-items: center; gap: var(--sp-2); margin-top: auto; padding-top: var(--sp-2); }

/* Bars (insights, finances) */
.am-hbars { display: flex; flex-direction: column; gap: var(--sp-3); }
.am-hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--sp-3); row-gap: 2px; align-items: center; }
.am-hbar-label { grid-column: 1 / -1; font: var(--caption); color: var(--muted); }
.am-hbar-track { height: 12px; border-radius: 999px; background: var(--am-quiet); overflow: hidden; }
.am-hbar-fill { height: 100%; border-radius: 999px; background: var(--green); }
.am-hbar-fill.is-blue { background: var(--am-blue); }
.am-hbar-fill.is-violet { background: var(--am-violet); }
.am-hbar-value { font: var(--caption-bold); color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; min-width: 72px; }
.am-powered { display: inline-flex; align-items: center; gap: var(--sp-1); font: var(--caption-bold); color: var(--green-tx); }
.am-insight-text { font: var(--body); color: var(--ink); }

/* Product updates */
.am-update { position: relative; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-6); overflow: hidden; }
.am-update::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--am-lilac); }
.am-update-head { display: flex; justify-content: space-between; gap: var(--sp-3); }
.am-update-title { font: var(--body-bold); }
.am-update-text { font: var(--caption); color: var(--muted); }

/* Activity summary */
.am-activity { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: var(--sp-6) 0; }
.am-activity > div { padding: 0 var(--sp-6); }
.am-activity > div + div { border-left: 1px solid var(--line); }
.am-activity .am-fig-label { display: inline-flex; align-items: center; gap: 2px; }
.am-activity .am-fig-value { font: var(--heading-01); font-variant-numeric: tabular-nums; }
.am-activity-sub { font: var(--caption); color: var(--muted); }

/* Item sales */
.am-topitems { width: 100%; border-collapse: collapse; }
.am-topitems th { padding: 0 0 var(--sp-2); font: var(--caption-bold); color: var(--muted); text-align: left; border-bottom: 1px solid var(--line-soft); }
.am-topitems th + th { text-align: right; }
.am-topitems td { padding: var(--sp-2) 0; font: var(--caption); color: var(--ink); font-variant-numeric: tabular-nums; }
.am-topitems td + td { text-align: right; }
.am-delta { display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; min-width: 72px; }
.am-delta.is-up { color: var(--am-up); }
.am-delta.is-down { color: var(--am-down); }

/* ===========================================================================
   View B — the mode. data-state: today | chat | split
   =========================================================================== */
.am-mode {
  position: relative;
  flex: 1 1 auto; min-height: 0;
  display: flex;
  padding: 0 var(--sp-3) var(--sp-3);
  background: #fff;
}
.am-today, .am-chat { display: none; min-height: 0; }
.am-mode[data-state="today"] .am-today { display: flex; }
.am-mode[data-state="chat"] .am-chat,
.am-mode[data-state="split"] .am-chat { display: flex; }

/* ---------- State 1: Today ---------- */
.am-today { flex-direction: column; width: 100%; max-width: var(--am-col); margin: 0 auto; transition: opacity var(--dur-fast) var(--ease); }
.am-today.is-leaving { opacity: 0; }
.am-today-scroll { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 var(--sp-4) var(--sp-6); scrollbar-width: thin; }
.am-today-head { display: flex; align-items: baseline; gap: var(--sp-3); margin: var(--sp-8) 0 var(--sp-4); }
.am-today-title { font: var(--heading-01); margin: 0; }
.am-today-date { font: var(--body); color: var(--muted); }
.am-yday { font: var(--body); color: var(--ink); font-variant-numeric: tabular-nums; }
.am-yday-label { color: var(--muted); }
.am-facts { margin: 0; font: var(--body); color: var(--ink); }
.am-outlook { margin: var(--sp-1) 0 0; font: var(--body); color: var(--ink-2); }
.am-sec { display: flex; align-items: baseline; gap: var(--sp-2); margin: var(--sp-8) 0 var(--sp-2); font: var(--heading-04); color: var(--ink); }
.am-sec-count { font: var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
/* An empty section is one muted line, not a heading over nothing. */
.am-sec.am-sec--empty { display: block; margin: var(--sp-6) 0 0; font: var(--body); color: var(--muted); }
.am-rows { list-style: none; margin: 0 calc(var(--sp-3) * -1); padding: 0; display: flex; flex-direction: column; gap: 2px; }
.am-row {
  width: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; column-gap: var(--sp-3); row-gap: 2px;
  padding: var(--sp-3);
  border-radius: var(--sp-3);
  text-align: left; cursor: pointer;
  transition: background 160ms ease;
}
.am-row:hover { background: var(--am-hover); }
.am-row.is-hl, .am-row.is-hl:hover, .am-row:active { background: var(--am-selected); }
.am-row-chev { grid-column: 3; grid-row: 1 / span 2; align-self: center; color: var(--faint); }
.am-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.am-row-title { grid-column: 1; grid-row: 1; display: flex; align-items: center; gap: var(--sp-2); min-width: 0; font: var(--body-bold); color: var(--ink); }
.am-row-title > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.am-row-meta { grid-column: 2; grid-row: 1; justify-self: end; font: var(--caption); color: var(--muted); white-space: nowrap; align-self: center; font-variant-numeric: tabular-nums; }
.am-row-ctx { grid-column: 1; grid-row: 2; font: var(--body); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.am-row-tag { grid-column: 2; grid-row: 2; justify-self: end; align-self: center; font: var(--caption); color: var(--muted); white-space: nowrap; }
.am-row.is-done .am-row-title, .am-row.is-done .am-row-ctx { color: var(--muted); }
.am-row.is-done .am-row-title svg { color: var(--muted); }
.am-none { font: var(--body); color: var(--muted); padding: var(--sp-1) 0; }
/* Needs you → Done today: the row fades out in place, then in at its new
   position while the rest of the list reflows (FLIP, in JS). */
.am-rows > li.is-ghost { transition: opacity var(--dur-fast) var(--ease); }
.am-rows > li.is-ghost.is-out { opacity: 0; }
[data-flip].is-held { display: none; }

/* Stop 5's suggestion: one chip above Today's input. */
.am-suggest { flex: 0 0 auto; display: flex; padding: 0 var(--sp-4); }
.am-chip {
  height: 32px; padding: 0 var(--sp-3);
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px var(--line);
  font: var(--caption-bold); color: var(--ink);
  cursor: pointer; white-space: nowrap;
}
.am-chip:hover { background: var(--am-hover); }
.am-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Composer (Today and Chat) ---------- */
/* A solid band behind the input with 16px above it, so a cut-off row reads
   as scrollable rather than clipped. */
.am-composer { position: relative; z-index: 1; flex: 0 0 auto; display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-4); background: #fff; }
.am-field {
  flex: 1 1 auto; min-width: 0;
  display: flex; align-items: center;
  height: 48px; padding: 0 var(--sp-1) 0 var(--sp-4);
  border: 1px solid var(--line); border-radius: var(--sp-3);
  background: #fff;
}
.am-field:focus-within { border-color: var(--faint); }
.am-field input { flex: 1 1 auto; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: var(--body); color: var(--ink); }
.am-field input::placeholder { color: var(--faint); opacity: 1; }
.am-field .am-iconbtn { width: 36px; height: 36px; }
.am-field .am-iconbtn img { width: 20px; height: 20px; }
.am-send { flex: 0 0 auto; width: var(--hit); height: var(--hit); display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: #fff; cursor: pointer; }
.am-send:disabled { background: var(--am-quiet); color: var(--faint); cursor: default; }
.am-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.am-send svg { stroke-width: 2; }

/* ---------- States 2 and 3: the chat column ---------- */
.am-chat {
  flex: 0 0 auto;
  flex-direction: column;
  width: var(--am-col); max-width: 100%;
  margin-left: max(0px, calc((100% - var(--am-col)) / 2));
  background: #fff;
  animation: am-fade-in var(--dur) var(--ease) both;    /* State 1 → 2 or 3 */
}
/* State 2 → 3: the column narrows. Only this direction animates. */
.am-mode[data-state="split"] .am-chat {
  width: var(--am-split); margin-left: 0;
  transition: width var(--dur-slow) var(--ease), margin-left var(--dur-slow) var(--ease);
}
.am-chat-head {
  flex: 0 0 auto;
  height: var(--sp-14);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 var(--sp-2);
  border-bottom: 1px solid var(--line-soft);
}
.am-chat-name { font: var(--label); color: var(--ink); }
.am-back {
  justify-self: start;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  height: var(--hit); padding: 0 var(--sp-3) 0 var(--sp-2);
  border-radius: var(--sp-2);
  font: var(--label); color: var(--ink);
  cursor: pointer;
}
.am-back:hover { background: var(--am-hover); }
.am-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.am-back img { width: var(--icon); height: var(--icon); }

.am-thread { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: var(--sp-2) var(--sp-4) var(--sp-6); scrollbar-width: thin; }
.am-dayg { display: flex; flex-direction: column; gap: var(--sp-6); }
.am-dayg + .am-dayg { margin-top: var(--sp-8); }
.am-day { margin: var(--sp-2) 0 calc(var(--sp-2) * -1); font: var(--caption-bold); color: var(--muted); }
.am-entry { display: flex; flex-direction: column; align-items: stretch; gap: var(--sp-1); min-width: 0; }
.am-entry--user { align-items: flex-end; }
.am-caption { font: var(--caption); color: var(--muted); }
.am-msg { font: var(--body); color: var(--ink); }
.am-sysline { font: var(--caption); color: var(--muted); }
.am-sysline .am-link { color: var(--ink); font: var(--caption-bold); }
/* Autonomy: a sentence, then two text buttons on their own line. */
.am-ask-btns { display: flex; gap: var(--sp-1); margin: 2px 0 0 calc(var(--sp-2) * -1); }
.am-ask-btns .btn { height: 32px; font: var(--caption-bold); }
.am-logs { display: flex; flex-direction: column; gap: var(--sp-1); margin-top: var(--sp-1); }
.am-logs:empty { display: none; }
.am-after { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-2); }
.am-after:empty { display: none; }
.am-backline .am-link { font: var(--caption); color: var(--muted); text-decoration: underline; }
.am-backline .am-link:hover { color: var(--ink); }
.msg--sent { overflow-wrap: anywhere; }

/* The working line: before any agent message that follows a tap. */
.am-working { font: var(--caption); color: var(--muted); }
.am-dots i { font-style: normal; animation: am-dot 900ms steps(1, end) infinite; }
.am-dots i:nth-child(2) { animation-delay: -600ms; }
.am-dots i:nth-child(3) { animation-delay: -300ms; }

/* Why: the last line of the message that introduces the card. */
.am-why { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; margin-top: 2px; padding: 0; font: var(--body); color: var(--muted); cursor: pointer; border-radius: 4px; }
.am-why:hover { color: var(--ink); }
.am-why:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.am-why svg { transition: transform 160ms ease; }
.am-why[aria-expanded="true"] svg { transform: rotate(180deg); }
.am-why-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.am-why-list li { position: relative; padding-left: var(--sp-4); font: var(--body); color: var(--ink-2); }
.am-why-list li::before { content: ''; position: absolute; left: 4px; top: 10px; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }

/* Vera's connected-data answer: one caption line per source, chip last. */
.am-answer { display: flex; flex-direction: column; gap: var(--sp-2); }
.am-figs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
.am-figs li { font: var(--caption); color: var(--muted); font-variant-numeric: tabular-nums; }
.am-figs b { font: var(--caption-bold); color: var(--ink); font-variant-numeric: tabular-nums; }
.am-src {
  display: inline-flex; align-items: center;
  height: 20px; padding: 0 var(--sp-2); margin: 0 2px;
  border-radius: 999px;
  background: var(--am-quiet); color: var(--ink-2);
  font: var(--caption-bold); font-size: 12px; line-height: 20px;
  vertical-align: 1px; white-space: nowrap;
}
.am-open-link { align-self: flex-start; margin-top: var(--sp-1); font: var(--body); text-decoration: underline; }

/* Approval card */
.am-acard {
  position: relative;
  margin-top: var(--sp-2);
  padding: var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--sp-3);
  background: #fff;
  cursor: pointer;
  transition: background 160ms ease, border-color 160ms ease;
}
.am-acard:hover { background: #FBFCFC; }
.am-acard.is-open, .am-acard.is-open:hover { background: var(--am-selected); border-color: transparent; }
/* Done: one line, no tint, no frame. The check and the line are enough. */
.am-acard.is-line, .am-acard.is-line:hover { padding: var(--sp-1) 0; border-color: transparent; background: transparent; overflow: hidden; cursor: default; }
.am-acard-title { margin: 0; font: var(--body-bold); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.am-acard-context { font: var(--body); color: var(--ink); margin-top: var(--sp-1); }
.am-acard-cons { font: var(--body); color: var(--muted); margin-top: var(--sp-2); font-variant-numeric: tabular-nums; }
.am-acard-actions { display: flex; align-items: center; gap: var(--sp-1); margin-top: var(--sp-3); }
/* Clover's three button levels: filled pill (the selected decision),
   outlined pill (every other pending decision, the "New sale" style),
   text (Edit). */
.am-acard-actions .btn { border-radius: 999px; }
.am-acard-line { display: flex; align-items: center; gap: var(--sp-1); min-width: 0; font: var(--body); color: var(--ink); white-space: nowrap; }
.am-acard-line b { font: var(--body-bold); color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.am-acard-line .am-link { color: var(--green-tx); }   /* the line's one target */
.am-acard-line svg { margin-right: 2px; color: var(--green-tx); }
.am-lines { margin-top: var(--sp-3); }
.am-line { display: flex; justify-content: space-between; gap: var(--sp-4); font: var(--body); color: var(--ink); padding: 2px 0; font-variant-numeric: tabular-nums; }
.am-line--total { margin-top: var(--sp-1); padding-top: var(--sp-1); border-top: 1px solid var(--am-rule); font: var(--body-bold); }


/* ---------- State 3: the Clover page window ---------- */
.am-win {
  position: relative;
  flex: 1 1 0; min-width: 0;
  display: none; flex-direction: column;
  margin-left: var(--sp-3);
  background: var(--tonal);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
/* The page enters from 24px right, 80 ms after the chat column starts. */
.am-mode[data-state="split"] .am-win { display: flex; animation: am-win-in var(--dur-slow) var(--ease) 80ms both; }
.am-win-head {
  position: relative;
  flex: 0 0 auto;
  height: 48px;
  display: flex; align-items: center; gap: var(--sp-3);
  padding: 0 var(--sp-2) 0 var(--sp-5);
  background: #fff;
  border-bottom: 1px solid var(--line);
}
/* Shared name with the card: its tint, as a bar on the window's edge. */
.am-win-head::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
.am-win.has-card .am-win-head::before { background: var(--am-selected); }
.am-win-head .am-crumb { flex: 1 1 auto; font: var(--caption-bold); }
.am-win-head .am-crumb-sep { width: 14px; height: 14px; }
.am-win-note { font: var(--caption); color: var(--muted); white-space: nowrap; }
.am-win-actions { display: flex; align-items: center; gap: var(--sp-1); flex: 0 0 auto; }
.am-win-actions .am-textbtn { height: 32px; font: var(--caption-bold); }
.am-win-actions .am-iconbtn { width: 32px; height: 32px; }
.am-win-actions .am-iconbtn img { width: 20px; height: 20px; }
.am-win-scroll { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 var(--sp-8) var(--sp-10); scrollbar-width: none; }
.am-win-scroll::-webkit-scrollbar { display: none; }
.am-win-scroll .am-ptop { margin-top: var(--sp-6); }
/* Page open: the highlighted cells pulse once. */
#pageBody.is-pulse .am-hl { animation: am-cell-pulse 600ms var(--ease); }
.am-sheet-handle { display: none; }
.am-scrim { display: none; }

/* ===========================================================================
   Demo stepper — presenter only. A translucent pill in the screen's
   bottom-right corner; gone after 3 s without pointer movement.
   =========================================================================== */
.am-stepper {
  position: absolute; right: var(--sp-4); bottom: var(--sp-4); z-index: 60;
  display: flex; align-items: center; gap: 2px;
  height: 32px; padding: 0 2px;
  border-radius: 999px;
  background: rgba(32, 33, 36, 0.56); color: #fff;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  font: var(--caption-bold); font-variant-numeric: tabular-nums;
  transition: opacity 200ms ease, visibility 0s;
}
.am-stepper.is-idle { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 200ms ease, visibility 0s linear 200ms; }
.am-stepper button { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: #fff; cursor: pointer; }
.am-stepper button:hover { background: rgba(255, 255, 255, 0.16); }
.am-stepper button:disabled { opacity: 0.32; cursor: default; background: none; }
.am-stepper button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.am-stepper span { min-width: 36px; text-align: center; }

/* Schedule: initial avatars. */
.am-person { display: inline-flex; align-items: center; gap: var(--sp-2); }
.am-avatar { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--am-quiet); color: var(--ink-2); font: var(--caption-bold); }

/* ===========================================================================
   Below 1024px (iPad portrait, phone): no bezel, single column
   =========================================================================== */
body.is-phone .stage { padding: 0; background: #fff; display: block; }
body.is-phone .ipad { width: 100%; height: 100%; aspect-ratio: auto; filter: none; }
body.is-phone .bezel, body.is-phone .statusbar { display: none; }
body.is-phone .screen { inset: 0; border-radius: 0; }
body.is-phone .screen-inner { width: 100%; height: 100%; transform: none !important; left: 0 !important; top: 0 !important; }

body.is-phone .topnav { padding: 0 var(--sp-2); }
body.is-phone .topnav-divider,
body.is-phone .topnav-left .navbtn--sm,
body.is-phone .topnav-right [data-nav="bell"],
body.is-phone .topnav-right [data-nav="settings"] { display: none; }
body.is-phone .topnav-logo { margin-left: var(--sp-2); }
body.is-phone .navbtn--pill { margin-right: 0; }
body.is-phone #viewA .rail { --rail-pad-l: 8px; --rail-pad-r: 8px; height: calc(100dvh - var(--sp-14)); }
body.is-phone #viewA .main { min-height: calc(100dvh - var(--sp-14) - var(--sp-3)); padding: 0 var(--sp-4) var(--sp-8); }
body.is-phone #viewA .main::before { margin: 0 calc(var(--sp-4) * -1) calc(var(--radius) * -1); }
body.is-phone .am-tiles { gap: var(--sp-2); }
body.is-phone .am-tile { padding: var(--sp-3); }
body.is-phone .am-tile-value { font: var(--heading-04); }
body.is-phone .am-card { padding: var(--sp-4); }
body.is-phone .am-grid-wrap { margin: 0 calc(var(--sp-4) * -1); padding: 0 var(--sp-4); }
body.is-phone .am-ptitle { font: var(--heading-02); }
body.is-phone .am-ptop { flex-wrap: wrap; }

body.is-phone .am-mode { padding: 0; }
body.is-phone .am-mode[data-state="split"] .am-chat { width: 100%; }
body.is-phone .am-composer { padding-bottom: max(var(--sp-4), env(safe-area-inset-bottom)); }
body.is-phone .am-today-head { margin-top: var(--sp-6); }
body.is-phone .am-win {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; height: 90%; margin: 0;
  border: 0; border-radius: var(--radius) var(--radius) 0 0;
  transform: translateY(100%); visibility: hidden; animation: none !important;
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1), visibility 0s linear 280ms;
}
body.is-phone .am-win.is-sheet-open { transform: none; visibility: visible; transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1), visibility 0s; }
body.is-phone .am-sheet-handle { display: flex; justify-content: center; padding: var(--sp-2) 0; background: #fff; touch-action: none; cursor: grab; }
body.is-phone .am-sheet-handle span { width: var(--sp-10); height: var(--sp-1); border-radius: 2px; background: var(--am-bar); }
body.is-phone .am-win-head { padding-left: var(--sp-4); }
body.is-phone .am-win-scroll { padding: 0 var(--sp-4) var(--sp-8); }

/* ---- status, derived ---- */

/* =====================================================================
   LIVE TEXT — one source for card, Today row and Why, so they agree.
   ===================================================================== */
function live(id) {
  let L;
  if (id === 'swap') {
    const c = SCH.cover.name, sick = SCH.sick, cs = coverShift();
    const before = hoursOf(person(c).shifts), after = before + span(cs);
    const ot = overtime(after);
    const otText = ot ? plural(ot, 'hr') + ' overtime' : 'no overtime';
    const line = after < SCH.overtimeAfter ? plural(SCH.overtimeAfter - after, 'hour') + ' under the ' + SCH.overtimeAfter + '-hour overtime line, per payroll'
      : after === SCH.overtimeAfter ? 'Right at the ' + SCH.overtimeAfter + '-hour overtime line, per payroll'
      : plural(ot, 'hour') + ' over the ' + SCH.overtimeAfter + '-hour overtime line, per payroll';
    L = {
      context: sick.dayName + ' · ' + sick.name + ' ' + shiftLabel(sickShift()) + ' (sick) → ' + c + ' ' + shiftLabel(cs),
      today: c + ' covers ' + sick.dayName + ' ' + shiftLabel(cs) + ' for ' + sick.name + ', ' + otText,
      consequence: c + ' ' + before + ' → ' + after + ' hrs · ' + otText,
      whyLabel: 'Why ' + c,
      why: SCH.cover.why.map(function (w) { return fillT(w, { line: line }); })
    };
  } else if (id === 'reorder') {
    const sup = supplier(), other = data.suppliers[otherKey()], tot = orderTotal();
    const delta = money(Math.abs(round2(tot - orderTotal(otherKey()))));
    L = {
      context: 'From ' + sup.name + ', arrives ' + sup.arrives,
      today: state.order.lines.map(function (l) { return l.qty + ' ' + l.short; }).join(' + ') + ' from ' + sup.name + ', lands ' + sup.arrives,
      lines: state.order.lines.map(function (l) {

      }).join('') + '<div class="am-line am-line--total"><span>Total</span><span>' + money(tot) + '</span></div>',
      consequence: money(tot) + ' · covers ' + plural(coverDays(), 'day') + ' · ' +

      whyLabel: 'Why ' + sup.name,

    };

function todayRows() {
  const needs = [], done = [];
  CARD_ORDER.forEach(function (id) {
    const c = data.cards[id], st = statusOf(id);
    if (st === 'waiting') needs.push({ id: id, title: c.title, ctx: live(id).today, agent: c.agent, time: clockLabel(c.at) });
    else if (st === 'done') done.push({ id: id, title: c.doneTitle, ctx: live(id).today, agent: c.agent, time: doneLabel(id), sort: doneAt(id),
                                        tag: c.auto ? 'Done for you' : 'Approved by you' });
  });
  if (state.now >= data.brief.at) {
    const b = data.brief;
    done.push({ id: 'brief', title: b.title, ctx: b.context, agent: b.agent, time: clockLabel(b.at), sort: b.at, tag: 'Done for you' });
  }
  done.sort(function (a, b) { return b.sort - a.sort; });
  return { needs: needs, done: done };
}
function rowHTML(r, o) {
  o = o || {};
  const li = o.ghost ? '<li class="is-ghost" aria-hidden="true">' : '<li data-flip="row:' + esc(r.id) + '"' + (o.held ? ' class="is-held"' : '') + '>';
  return li + '<button class="am-row' + (o.hl ? ' is-hl' : '') + (o.done ? ' is-done' : '') + '" type="button"' +
      (o.ghost ? ' tabindex="-1"' : ' data-act="today-row" data-id="' + esc(r.id) + '"') + (o.hl ? ' aria-current="true"' : '') + '>' +
    '<span class="am-row-title">' + (o.done ? svg('check', 18) : '') + '<span>' + esc(r.title) + '</span></span>' +
    '<span class="am-row-meta">' + esc(r.agent) + ' · ' + esc(r.time) + '</span>' +
    '<span class="am-row-ctx">' + esc(r.ctx) + '</span>' +
    (r.tag ? '<span class="am-row-tag">' + esc(r.tag) + '</span>' : '') +
    '<span class="am-row-chev">' + svg('chevronRight', 16) + '</span>' +
  '</button></li>';
}
/* What Today last showed, so a return can animate what changed. */
let lastToday = null;
/* t.prev + t.moved: rows that left Needs you stay in place as ghosts (to fade
   out) and are held back from Done today (to fade in after). */
function renderToday(t) {
  t = t || {};
  const R = todayRows(), y = data.yesterday, n = R.needs.length;
  const moved = t.moved || {}, ghosting = Object.keys(moved).length > 0;
  let needs = '';
  if (ghosting) {
    const cur = {}; R.needs.forEach(function (r) { cur[r.id] = r; });
    const order = t.prev.needs.map(function (r) { return moved[r.id] ? { ghost: r } : cur[r.id] ? { row: cur[r.id] } : null; }).filter(Boolean);
    R.needs.forEach(function (r) { if (!order.some(function (x) { return x.row === r; })) order.push({ row: r }); });
    needs = '<ul class="am-rows" data-sec="needs">' + order.map(function (x) {
      return x.ghost ? rowHTML(x.ghost, { ghost: true, hl: x.ghost.hl }) : rowHTML(x.row, {});
    }).join('') + '</ul>';
  } else if (n) {
    needs = '<ul class="am-rows" data-sec="needs">' + R.needs.map(function (r, i) { return rowHTML(r, { hl: i === 0 }); }).join('') + '</ul>';
  }
  if (!n) needs += '<p class="am-none' + (ghosting ? ' is-held' : '') + '" data-flip="none-needs">Nothing yet. Items appear here as the day goes.</p>';
  $('#todayScroll').innerHTML =
    '<header class="am-today-head"><h1 class="am-today-title">Today</h1><span class="am-today-date">' + esc(DATES.todayLong) + '</span></header>' +
    '<p class="am-yday"><span class="am-yday-label">Yesterday</span> · ' + money0(y.net) + ' net sales · ' + esc(ydayVs()) + ' · ' + y.orders + ' orders</p>' +
    '<h2 class="am-sec">Outlook</h2>' +
    '<p class="am-facts">' + data.outlook.facts.map(esc).join(' · ') + '</p>' +
    '<p class="am-outlook">' + esc(data.outlook.note) + '</p>' +
    '<h2 class="am-sec" data-flip="h-needs">Needs you' + (n ? ' <span class="am-sec-count">(' + n + ')</span>' : '') + '</h2>' + needs +
    '<h2 class="am-sec am-sec--empty" data-flip="h-running">Running · nothing running</h2>' +
    '<h2 class="am-sec" data-flip="h-done">Done today</h2>' +
    '<ul class="am-rows" data-sec="done">' + R.done.map(function (r) { return rowHTML(r, { done: true, held: !!moved[r.id] }); }).join('') + '</ul>';
  if (t.shown) lastToday = { needs: R.needs.map(function (r, i) { return Object.assign({ hl: i === 0 }, r); }) };
}
/* Back on Today after an approval: the row fades out in place (--dur-fast),
   then fades in under Done today (--dur) while the list reflows (--dur). */
function animateToday(prev) {
  const nowDone = {};
  todayRows().done.forEach(function (r) { nowDone[r.id] = true; });
  const moved = {};
  (prev ? prev.needs : []).forEach(function (r) { if (nowDone[r.id]) moved[r.id] = true; });
  if (!Object.keys(moved).length || reduced()) { renderToday({ shown: true }); return; }
  busy = true;
  renderToday({ prev: prev, moved: moved, shown: true });
  const box = $('#todayScroll');
  void box.offsetHeight;
  box.querySelectorAll('li.is-ghost').forEach(function (li) { li.classList.add('is-out'); });
  later(ms('--dur-fast'), function () {
    const before = {};
    box.querySelectorAll('[data-flip]:not(.is-held)').forEach(function (el) { before[el.dataset.flip] = el.offsetTop; });
    box.querySelectorAll('li.is-ghost').forEach(function (li) { li.remove(); });
    box.querySelectorAll('.is-held').forEach(function (el) { el.classList.remove('is-held'); });
    const first = box.querySelector('[data-sec="needs"] .am-row');
    if (first) { first.classList.add('is-hl'); first.setAttribute('aria-current', 'true'); }
    const dur = ms('--dur'), ease = easing();
    box.querySelectorAll('[data-flip]').forEach(function (el) {
      const k = el.dataset.flip;
      if (!(k in before)) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, easing: ease, fill: 'backwards' }); return; }
      const dy = before[k] - el.offsetTop;
      if (dy) el.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: dur, easing: ease });
    });
    busy = false;
  });
}

    '<button class="btn btn-text" type="button" data-act="ask-answer" data-key="' + key + '" data-val="yes">' + esc(a.yes) + '</button>' +
    '<button class="btn btn-text" type="button" data-act="ask-answer" data-key="' + key + '" data-val="no">' + esc(a.no) + '</button></div></div>';
}
/* Under a done card: its autonomy line (if it has one), then, while it is
   the open card, the way back to Today. An unanswered autonomy question
   belongs to its own stop; later in the day it simply is not asked again. */
function stopOf(id) { return data.stops.findIndex(function (s) { return s.at === data.cards[id].at; }); }
function afterHTML(id, on, base) {
  const c = data.cards[id], parts = [];
  if (statusOf(id) !== 'done') return '';
  if (c.ask && (state.ask[c.ask] || stopOf(id) === state.stop)) parts.push(askHTML(c.ask));
  if (state.openId === id) parts.push('<p class="am-backline"><button class="am-link" type="button" data-act="back-today">Back to Today</button></p>');
  return '<div class="am-after" data-after="' + id + '">' + parts.map(function (p, i) {
    return '<div class="' + dz(on, i, base) + '">' + p + '</div>';
  }).join('') + '</div>';
}
/* The header already says Vera; captions carry the agent label and time only. */
function captionHTML(agent, time, drop) {
  return '<p class="am-caption' + (drop || '') + '">' + (agent ? esc(agent) + ' · ' : '') + esc(time) + '</p>';
}
function workingHTML(key, text) {
  return '<div class="am-entry" data-entry="' + esc(key) + '"><p class="am-working" role="status">' + esc(data.name) + ' · ' + esc(text) +
    '<span class="am-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p></div>';
}
function briefEntryHTML() {
  const b = data.brief;
  return '<div class="am-entry" data-entry="brief">' + captionHTML(b.agent, clockLabel(b.at)) +
    '<p class="am-msg">' + esc(fillT(b.text, textVars())) + '</p></div>';
}
function cardEntryHTML(id) {
  const c = data.cards[id];
  if (state.working && state.working.id === id) return workingHTML(id, c.working);
  const d = !!state.drop[id], a = !!state.drop['after:' + id];
  const why = whyHTML(id);
  return '<div class="am-entry" data-entry="' + id + '">' +
    captionHTML(c.agent, clockLabel(c.at), dz(d, 0)) +
    '<p class="am-msg' + dz(d, 1) + '">' + esc(c.text) + '</p>' +
    (why ? '<div class="am-whywrap' + dz(d, 2) + '">' + why + '</div>' : '') +
    '<div class="am-cardwrap' + dz(d, 3) + '">' + cardHTML(id) + '</div>' +
    '<div class="am-logs" data-logs="' + id + '">' + (state.logs[id] || []).map(function (l) { return sysHTML(l.text); }).join('') + '</div>' +
    afterHTML(id, d || a, d ? 4 * 60 : ms('--dur')) +
  '</div>';
}
function answerHTML(t) {
  const P = data.pnl, d = !!state.drop[t.id];
  return '<div class="am-entry" data-entry="' + t.id + '">' + captionHTML(data.name, t.time, dz(d, 0)) +
    '<div class="am-answer"><p class="am-msg' + dz(d, 1) + '">' + esc(t.headline) + '</p>' +
      '<ul class="am-figs" aria-label="By source">' + P.lines.map(function (l, i) {
        return '<li class="' + dz(d, 2 + i) + '">' + esc(l.label) + ' <b>' + money0(l.oct) + '</b> <span class="am-src">' + esc(l.src) + '</span></li>';
      }).join('') + '</ul>' +
      '<p class="am-msg' + dz(d, 2 + P.lines.length) + '">' + esc(P.note) + '</p></div>' +
    '<button class="am-link am-open-link' + dz(d, 3 + P.lines.length) + '" type="button" data-act="open-page" data-page="pl">Open in Reports</button></div>';
}
function tailHTML(t) {
  if (t.kind === 'user') return '<div class="am-entry am-entry--user" data-entry="' + t.id + '"><p class="msg--sent">' + esc(t.text) + '</p></div>';
  if (t.kind === 'answer') return answerHTML(t);
  const d = !!state.drop[t.id];
  return '<div class="am-entry" data-entry="' + t.id + '">' + captionHTML(data.name, t.time, dz(d, 0)) + '<p class="am-msg' + dz(d, 1) + '">' + esc(t.text) + '</p></div>';
}
/* The thread up to now: yesterday's one history line, the brief, every card
   that has arrived, then the merchant's questions. */
function renderThread(opts) {
  opts = opts || {};
  const el = $('#thread'), keep = el.scrollTop;
  const a = document.activeElement;
  const focusKey = a && el.contains(a) && a.dataset.act
    ? '[data-act="' + a.dataset.act + '"]' + (a.dataset.card ? '[data-card="' + a.dataset.card + '"]' : '') : null;
  const today = [];
  if (state.now >= data.brief.at) today.push(briefEntryHTML());
  CARD_ORDER.forEach(function (id) { if (arrived(id)) today.push(cardEntryHTML(id)); });
  state.tail.forEach(function (t) { today.push(tailHTML(t)); });
  if (state.working && state.working.tail) today.push(workingHTML(state.working.id, state.working.text));
  el.innerHTML =
    '<section class="am-dayg" aria-label="Yesterday"><h2 class="am-day">Yesterday</h2>' + sysHTML(data.history.text, data.history.time) + '</section>' +
    (today.length ? '<section class="am-dayg" aria-label="Today"><h2 class="am-day">Today</h2>' + today.join('') + '</section>' : '');
  state.drop = {};                         // each arrival animates once
  if (focusKey && !el.contains(document.activeElement)) {
    const n = el.querySelector(focusKey);
    if (n) n.focus({ preventScroll: true });
  }
  if (opts.toEnd) { el.style.paddingBottom = ''; el.scrollTop = el.scrollHeight; }
  else if (opts.toEntry) scrollThreadTo(opts.toEntry);
  else el.scrollTop = keep;
}
/* The selected entry's caption lands 24px from the top. If the thread is too short
   below it, the bottom padding grows so it can. offsetTop: the canvas is scaled. */
function scrollThreadTo(id) {
  const t = $('#thread'), target = $('#thread [data-entry="' + id + '"]');
  if (!target) return;
  t.style.paddingBottom = '';
  let y = 0, n = target;
  while (n && n !== t && t.contains(n)) { y += n.offsetTop; n = n.offsetParent; }
  const top = Math.max(0, y - 24);
  const last = t.lastElementChild, end = last ? last.offsetTop + last.offsetHeight : 0;
  const need = top + t.clientHeight - end;
  if (need > parseFloat(getComputedStyle(t).paddingBottom)) t.style.paddingBottom = need + 'px';
  const still = top - (t.scrollHeight - t.clientHeight);
  if (still > 0) t.style.paddingBottom = (parseFloat(getComputedStyle(t).paddingBottom) + still) + 'px';
  t.scrollTop = top;
}

/* =====================================================================
   STATE 3 — the page window
   ===================================================================== */
let lastAnchor = null, lastPageHTML = '';
function renderPage(entering) {
  const id = state.page, body = $('#pageBody');
  if (!id) { body.innerHTML = lastPageHTML = ''; lastAnchor = null; return; }
  const p = data.pages[id];
  $('#winCrumb').innerHTML = crumbHTML(p.path).replace(/^<nav class="am-crumb"[^>]*>|<\/nav>$/g, '');
  $('#win').classList.toggle('has-card', !!(state.openId && data.cards[state.openId].page === id));
  const html = pageHTML(id, 'assist');
  if (html !== lastPageHTML) { body.innerHTML = lastPageHTML = html; }   // unchanged pages keep their DOM (and any pulse)
  const key = id + ':' + (state.openId || '');
  if (lastAnchor !== key) anchorPage(entering && !reduced() ? ms('--dur-slow') + 80 : 0);
  lastAnchor = key;
  revealHighlight();
}
/* Page open: the page starts at the top and scrolls smoothly to its anchor
   card (after the window has entered), then the highlighted cells pulse once. */
function anchorPage(delay) {
  const sc = $('#winScroll');
  sc.style.paddingBottom = '';
  sc.scrollTop = 0;
  if (!state.openId || !$('#pageBody [data-anchor]')) return;
  const go = function () {
    const card = $('#pageBody [data-anchor]');
    if (!card) return;
    sc.style.paddingBottom = '';
    const target = Math.max(0, card.offsetTop - 16);
    const body = $('#pageBody'), end = body.offsetTop + body.offsetHeight;
    const need = target + sc.clientHeight - end;
    if (need > parseFloat(getComputedStyle(sc).paddingBottom)) sc.style.paddingBottom = need + 'px';
    if (Math.abs(sc.scrollTop - target) < 2) { pulse(); return; }
    let fired = false;
    const fin = function () { if (fired) return; fired = true; sc.removeEventListener('scrollend', fin); pulse(); };
    sc.addEventListener('scrollend', fin);
    later(700, fin);
    sc.scrollTo({ top: target, behavior: reduced() ? 'auto' : 'smooth' });
  };
  if (delay) later(delay, go); else go();
}
function pulse() {
  const b = $('#pageBody');
  if (reduced() || !b.querySelector('.am-hl')) return;
  b.classList.remove('is-pulse');
  void b.offsetWidth;
  b.classList.add('is-pulse');
  later(600, function () { b.classList.remove('is-pulse'); });
}
function revealHighlight() {
  const wrap = $('#pageBody .am-grid-wrap');
  const cell = wrap && wrap.querySelector('.am-hl, .am-hl-warn');
  if (!cell || wrap.scrollWidth <= wrap.clientWidth) return;
  requestAnimationFrame(function () {
    const w = wrap.getBoundingClientRect(), c = cell.getBoundingClientRect();
    const scale = w.width / wrap.offsetWidth || 1;
    wrap.scrollLeft += ((c.left + c.width / 2) - (w.left + w.width / 2)) / scale;
  });
}

/* =====================================================================
   render(state) — the one writer. The clock, the Vera badge, the
   "Needs you (n)" heading, the waiting cards, Today's lists and the input
   placeholder all derive here from the same state; nothing is set twice.
   ===================================================================== */
let lastState = 'today';
function render(s, opts) {
  opts = opts || {};
  const n = waitingIds().length, on = s.view === 'mode';
  $('#sbTime').textContent = clockLabel(s.now).replace(/ (am|pm)$/, '');
  $('#merchantName').textContent = data.merchant;
  const badge = $('#askBadge');
  badge.textContent = n; badge.hidden = !n;
  const btn = $('#askBtn');
  btn.classList.toggle('is-active', on);
  btn.setAttribute('aria-pressed', String(on));
  $('#askLabel').textContent = data.name;      // the pill, the chat header and the working line share one name
  btn.setAttribute('aria-label', data.name + (n ? ', ' + n + ' need' + (n === 1 ? 's' : '') + ' you' : ''));
  const S = data.stops[s.stop], last = data.stops.length - 1;
  $('#stepperLabel').textContent = (s.stop + 1) + ' / ' + data.stops.length;
  $('#stepper').setAttribute('aria-label', 'Demo stepper, stop ' + (s.stop + 1) + ' of ' + data.stops.length + ': ' + clockLabel(S.at) + ', ' + S.title);
  $('#stepper [data-act="stop-prev"]').disabled = s.stop === 0;
  $('#stepper [data-act="stop-next"]').disabled = s.stop === last;
  if (!on) { lastState = 'today'; renderDashboard(); return; }

  const name = stateName(), mobile = isMobile();
  const entering = name === 'split' && lastState !== 'split';
  lastState = name;
  $('#viewB').dataset.state = name;
  const sheet = mobile && name === 'split', win = $('#win');
  win.classList.toggle('is-sheet-open', sheet);
  win.setAttribute('role', mobile ? 'dialog' : 'region');
  win.setAttribute('aria-modal', sheet ? 'true' : 'false');
  $('#scrim').classList.toggle('is-on', sheet);
  $('#assistantName').textContent = data.name;
  $('#todayInput').placeholder = 'Ask about anything';
  $('#composerInput').placeholder = name === 'split' ? data.pages[s.page].ask : 'Ask about anything';
  /* Stop 5 only: one suggestion above Today's input, until it is asked. */
  const sug = $('#todaySuggest'), chip = s.stop === last && !s.tail.length;
  sug.hidden = !chip;
  sug.innerHTML = chip ? '<button class="am-chip" type="button" data-act="suggest">' + esc(data.pnl.q) + '</button>' : '';

  if (name === 'today') { if (opts.animateFrom) animateToday(opts.animateFrom); else renderToday({ shown: true }); }
  else renderToday();                      // hidden, but its counts stay true
  renderPage(entering);
  renderThread(opts);
  if (opts.toEntry) setTimeout(function () { scrollThreadTo(opts.toEntry); }, 300);   // after the column settles
}

/* =====================================================================
   NAVIGATION
   ===================================================================== */
function showMode() {
  state.view = 'mode';
  $('#viewA').hidden = true;
  $('#viewB').hidden = false;
}
function focusToday() {
  const first = $('#todayScroll .am-row.is-hl') || $('#todayInput');
  first.focus({ preventScroll: true });
}
function enterMode() {
  showMode();
  state.screen = 'today';
  state.page = null; state.openId = null; state.sheetOpen = false;
  render(state);
  $('#todayScroll').scrollTop = 0;
  focusToday();
}
function exitMode() {
  clearTimers();
  state.view = 'dashboard';
  state.sheetOpen = false; state.working = null;
  $('#today').classList.remove('is-leaving');
  $('#viewB').hidden = true;
  $('#viewA').hidden = false;
  render(state);
  $('#viewA').scrollTop = 0;
  $('#askBtn').focus();
}
/* Every stop returns here. Rows that changed section animate (animateToday). */
function backToToday() {
  if (busy) return;
  clearTimers();
  const prev = lastToday;
  state.screen = 'today';
  state.page = null; state.openId = null; state.sheetOpen = false; state.working = null;
  render(state, { animateFrom: prev });
  focusToday();
}
function closePage() {
  if (isMobile()) state.sheetOpen = false;        // the sheet closes; the card stays selected
  else { state.page = null; state.openId = null; }
  render(state);
}
/* Select a card: chat column, its page beside it (a sheet on single column). */
function openCard(id, sheet) {
  state.openId = id;
  state.page = data.cards[id].page;
  state.screen = 'chat';
  if (isMobile()) state.sheetOpen = !!sheet;
}
function openPage(pageId, sheet) {
  state.page = pageId;
  state.openId = null;
  state.screen = 'chat';
  if (isMobile()) state.sheetOpen = sheet !== false;
}
function focusIn(cardId, sel) {
  const root = $('#thread [data-card-root="' + cardId + '"]');
  const el = root && root.querySelector(sel);
  if (el) el.focus({ preventScroll: true });
}
/* State 1 → 2 or 3: Today fades out (--dur-fast); the chat column then fades in (CSS). */
function leaveToday(fn) {
  if (stateName() !== 'today' || !ms('--dur-fast')) { fn(); return; }
  busy = true;
  $('#today').classList.add('is-leaving');
  later(ms('--dur-fast'), function () {
    $('#today').classList.remove('is-leaving');
    busy = false;
    fn();
  });
}
function todayRow(id) {
  if (busy) return;
  leaveToday(function () {
    if (id === 'brief') {
      state.screen = 'chat'; state.page = null; state.openId = null;
      render(state, { toEntry: 'brief' });
      return;
    }
    reveal(id);
  });
}
/* Open a card in State 3. The first time, the working line holds its place
   for 800 ms; then the caption, message and card drop in. */
function reveal(id) {
  openCard(id, true);
  const focus = function () { focusIn(id, '[data-act="primary"], [data-act="undo"], [data-act="view-filing"]'); };
  if (state.seen[id]) { render(state, { toEntry: id }); focus(); return; }
  state.working = { id: id, text: data.cards[id].working };
  render(state, { toEntry: id });
  later(data.timing.working, function () {
    state.working = null;
    state.seen[id] = true;
    state.drop[id] = true;
    render(state, { toEntry: id });
    focus();
  });
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function log(cardId, text) {
  state.logs[cardId].push({ text: text });
  const box = $('#thread [data-logs="' + cardId + '"]');
  if (box) box.insertAdjacentHTML('beforeend', sysHTML(text));
}
/* Approve: the clock moves to the action, the card collapses to its done
   line (height and opacity, --dur), then the autonomy line and the way back. */
function primary(id) {
  const c = data.cards[id];
  const before = $('#thread [data-card-root="' + id + '"]'), h0 = before ? before.offsetHeight : 0;
  state.now = Math.max(state.now, c.actAt);
  state.done[id] = state.now;
  state.openId = id;
  state.page = c.page;
  state.drop['after:' + id] = true;
  render(state);
  const card = $('#thread [data-card-root="' + id + '"]'), dur = ms('--dur');
  if (card && h0 && dur) {
    card.animate([{ height: h0 + 'px', opacity: 0 }, { height: card.offsetHeight + 'px', opacity: 1 }], { duration: dur, easing: easing() });
  }
  focusIn(id, '[data-act="undo"]');
}
function undo(id) {
  delete state.done[id];
  openCard(id, false);
  render(state);
  focusIn(id, '[data-act="primary"]');
}
/* Edit focuses the field on the page where the draft lives. */
const EDIT_TARGET = { swap: '#pageBody [data-edit="end"]', reorder: '#pageBody .am-qty' };
function edit(id) {
  openCard(id, true);
  render(state);
  const t = $(EDIT_TARGET[id]);
  if (t) { t.focus({ preventScroll: true }); if (t.select) t.select(); }
}
function tapCard(id) {
  if (state.openId === id && stateName() === 'split') return;
  openCard(id, true);
  render(state);
}
function viewFiling(id) {
  openCard(id, true);
  lastAnchor = null;                       // scroll back to the filing and pulse it
  render(state);
}
function toggleWhy(id) {
  state.whyOpen[id] = !state.whyOpen[id];
  const b = $('#thread [data-act="why"][data-card="' + id + '"]'), l = $('#why-' + id);
  if (b) b.setAttribute('aria-expanded', String(state.whyOpen[id]));
  if (l) l.hidden = !state.whyOpen[id];
}

/* ---- edits on the page ---- */
function updateOrderTotals() {
  state.order.lines.forEach(function (l, i) {
    const c = $('#pageBody [data-line-total="' + i + '"]');
    if (c) c.textContent = money(lineTotal(l));
  });
  const tot = $('#pageBody [data-order-total]');
  if (tot) tot.textContent = money(orderTotal());
  refreshLive('reorder');
}
function parseQty(s) { s = String(s).trim(); return /^\d+$/.test(s) ? Math.min(9999, parseInt(s, 10)) : null; }
function commitQty(input) {
  const i = +input.dataset.line, line = state.order.lines[i];
  input.value = line.qty;
  if (line.qty !== state.committedQty[i]) {
    state.committedQty[i] = line.qty;
    log('reorder', 'You changed ' + line.item + ' to ' + line.qty);
  }
}

/* ---- questions: the sent bubble, the working line, then the answer ---- */
let qSeq = 0;
function ask(text) {
  const n = ++qSeq, key = 'a-' + n, fixed = data.answers[text] || null;
  const profit = !fixed && new RegExp(data.profitRe, 'i').test(text);
  state.tail.push({ kind: 'user', id: 'q-' + n, text: text });
  state.working = { id: key, text: profit ? data.pnl.working : fixed ? fixed.working : 'checking', tail: true };
  render(state, { toEnd: true });
  later(profit || fixed ? data.timing.answerWorking : data.timing.working, function () {
    state.working = null;
    if (fixed) {
      state.tail.push({ kind: 'assistant', id: key, time: clockLabel(state.now), text: fixed.text });
    } else if (profit) {
      const net = data.pnl.lines.reduce(function (s, l) { return s + l.sign * l.oct; }, 0);
      state.tail.push({ kind: 'answer', id: key, time: clockLabel(state.now),
                        headline: (net >= 0 ? 'Yes, by about ' : 'Not yet; down about ') + money0(Math.abs(net)) + ' so far.' });
    } else {
      state.tail.push({ kind: 'assistant', id: key, time: clockLabel(state.now), text: data.cannedReply });
    }
    state.drop[key] = true;
    render(state, { toEnd: true });
  });
}
/* Home's "Ask Vera" chips: straight into the mode's chat, question asked. */
function askFromHome(text) {
  clearTimers();
  showMode();
  $('#today').classList.remove('is-leaving');
  state.screen = 'chat'; state.page = null; state.openId = null; state.sheetOpen = false;
  ask(text);
  $('#composerInput').focus({ preventScroll: true });
}
function askFromToday(text) {
  if (busy) return;
  leaveToday(function () {
    state.screen = 'chat'; state.page = null; state.openId = null;
    ask(text);
  });
}

/* =====================================================================
   STOPS — slide 10, in order. Each jump sets the world at that stop. Stop 1
   lands on Clover Home (the brief, then Open Vera); stops 2–5 land on
   Vera's Today. State is cumulative: what the presenter did at an
   earlier stop stays done; the current stop and later ones start fresh.
   ===================================================================== */
function setStop(i) {
  i = Math.max(0, Math.min(data.stops.length - 1, i));
  clearTimers();
  $('#today').classList.remove('is-leaving');
  const S = data.stops[i];
  state.stop = i;
  state.now = S.clock;
  CARD_ORDER.forEach(function (id) { if (data.cards[id].at >= S.at) resetCard(id); });
  state.tail = []; state.working = null; state.drop = {};
  if (document.activeElement && document.activeElement !== document.body && !$('#stepper').contains(document.activeElement)) document.activeElement.blur();
  state.screen = 'today';
  state.page = null; state.openId = null; state.sheetOpen = false;
  if (i === 0) {
    state.view = 'dashboard'; state.dashPage = 'home';
    $('#viewB').hidden = true;
    $('#viewA').hidden = false;
  } else {
    showMode();
  }
  render(state);
  $('#viewA').scrollTop = 0;
  $('#todayScroll').scrollTop = 0;
  $('#thread').scrollTop = 0;
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-act]');
  if (!el) {
    const root = e.target.closest('[data-card-root]');
    if (root && state.view === 'mode' && statusOf(root.dataset.cardRoot) === 'waiting') tapCard(root.dataset.cardRoot);
    return;
  }
  const id = el.dataset.card;
  switch (el.dataset.act) {
    case 'noop': break;
    case 'nav':
      state.dashPage = el.dataset.page;
      renderDashboard();
      $('#viewA').scrollTop = 0;
      break;
    case 'ask-me': if (state.view === 'mode') exitMode(); else enterMode(); break;
    case 'open-vera': enterMode(); break;
    case 'home-ask': askFromHome(el.dataset.q); break;
    case 'back-today': backToToday(); break;
    case 'today-row': todayRow(el.dataset.id); break;
    case 'suggest': askFromToday(data.pnl.q); break;
    case 'open-page': openPage(el.dataset.page); render(state); break;
    case 'page-tab':
      if (state.view === 'mode') { state.page = el.dataset.page; state.openId = null; render(state); }
      else { state.dashPage = el.dataset.page; renderDashboard(); }
      break;
    case 'open-full': state.dashPage = state.page; exitMode(); break;
    case 'close-page': closePage(); break;
    case 'primary': primary(id); break;
    case 'undo': undo(id); break;
    case 'edit': edit(id); break;
    case 'view-filing': viewFiling(id); break;
    case 'why': toggleWhy(id); break;
    case 'ask-answer':
      state.ask[el.dataset.key] = el.dataset.val;
      render(state);
      break;
    case 'stop-prev': setStop(state.stop - 1); break;
    case 'stop-next': setStop(state.stop + 1); break;
  }
});

/* Structured drafts are edited on the page. */
const pageBody = $('#pageBody');
pageBody.addEventListener('change', function (e) {
  const t = e.target, which = t.dataset.edit;
  if (which === 'start' || which === 'end') {
    let s = state.cover.start, en = state.cover.end;
    const v = +t.value;
    if (which === 'start') { s = v; if (en <= s) en = s + 1; } else { en = v; if (s >= en) s = en - 1; }
    state.cover = { start: s, end: en };
    log('swap', 'You changed ' + SCH.cover.name + ' to ' + shiftLabel(coverShift()));
    render(state);
    $('#pageBody [data-edit="' + which + '"]').focus();
  } else if (which === 'supplier') {
    const before = orderTotal();
    state.order.supplier = t.value;
    const diff = round2(before - orderTotal());
    log('reorder', 'You switched to ' + supplier().name + ', ' + (diff === 0 ? 'same price' : money(Math.abs(diff)) + (diff > 0 ? ' less' : ' more')));
    render(state);
    $('#pageBody [data-edit="supplier"]').focus();
  }
});
pageBody.addEventListener('input', function (e) {
  const q = e.target.closest('.am-qty');
  if (!q) return;
  const v = parseQty(q.value);
  if (v === null) return;
  state.order.lines[+q.dataset.line].qty = v;
  updateOrderTotals();
});
pageBody.addEventListener('focusout', function (e) { if (e.target.closest('.am-qty')) commitQty(e.target); });
pageBody.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.closest('.am-qty')) e.target.blur(); });

/* Composer. Typing in Today's input moves to State 2 and keeps typing there. */
const input = $('#composerInput'), sendBtn = $('#sendBtn'), todayInput = $('#todayInput');
todayInput.addEventListener('input', function () {
  if (!todayInput.value || busy) return;
  leaveToday(function () {
    const v = todayInput.value;
    todayInput.value = '';
    state.screen = 'chat'; state.page = null; state.openId = null;
    render(state, { toEnd: true });
    input.value = v;
    sendBtn.disabled = !v.trim();
    input.focus();
    input.setSelectionRange(v.length, v.length);
  });
});
$('#todayComposer').addEventListener('submit', function (e) { e.preventDefault(); });
input.addEventListener('input', function () { sendBtn.disabled = !input.value.trim(); });
$('#composer').addEventListener('submit', function (e) {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  ask(text);
});

/* Stepper keys. ArrowRight at the last stop does nothing: it is the closing frame. */
document.addEventListener('keydown', function (e) {
  const typing = e.target.closest && e.target.closest('input, textarea, select');
  if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) {
    const last = data.stops.length - 1;
    if (e.key === 'ArrowRight') { e.preventDefault(); if (state.stop < last) setStop(state.stop + 1); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); if (state.stop > 0) setStop(state.stop - 1); return; }
    if (/^[1-5]$/.test(e.key)) { setStop(+e.key - 1); return; }
  }
  if (e.key === 'Escape' && state.view === 'mode' && stateName() === 'split') closePage();
});

/* The stepper pill hides after 3 s without pointer movement and returns on movement. */
(function () {
  const pill = $('#stepper');
  let t = null;
  function wake() {
    pill.classList.remove('is-idle');
    clearTimeout(t);
    t = setTimeout(function () { pill.classList.add('is-idle'); }, data.timing.idle);
  }
  document.addEventListener('pointermove', wake, { passive: true });
  document.addEventListener('pointerdown', wake, { passive: true });
  wake();
})();

/* Sheet: drag the handle down to dismiss. */
(function () {
  const handle = $('#sheetHandle'), win = $('#win');
  let drag = null;
  handle.addEventListener('pointerdown', function (e) {
    if (stateName() !== 'split' || !isMobile()) return;
    drag = { y: e.clientY, dy: 0 };
    handle.setPointerCapture(e.pointerId);
    win.style.transition = 'none';
  });
  handle.addEventListener('pointermove', function (e) {
    if (!drag) return;
    drag.dy = Math.max(0, e.clientY - drag.y);
    win.style.transform = 'translateY(' + drag.dy + 'px)';
  });
  function end() {
    if (!drag) return;
    const close = drag.dy > 96;
    drag = null;
    win.style.transition = ''; win.style.transform = '';
    if (close) closePage();
  }
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
})();

/* =====================================================================
   CANVAS
   ===================================================================== */
const inner = $('#screenInner'), screenEl = $('.screen');
const DESIGN_W = 1280, DESIGN_H = 834;
function fit() {
  const single = isMobile();
  document.body.classList.toggle('is-phone', single);
  if (single) { inner.style.transform = inner.style.left = inner.style.top = ''; return; }
  const sw = screenEl.clientWidth, sh = screenEl.clientHeight;
  const scale = Math.min(sw / DESIGN_W, sh / DESIGN_H);
  inner.style.transform = 'scale(' + scale + ')';
  inner.style.left = ((sw - DESIGN_W * scale) / 2) + 'px';
  inner.style.top  = ((sh - DESIGN_H * scale) / 2) + 'px';
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(screenEl);
window.addEventListener('resize', fit);
mqSingle.addEventListener('change', function () {
  state.sheetOpen = isMobile() && !!state.page;
  fit();
  render(state);
});

/* =====================================================================
   BOOT  (?stop=1..5 starts at a stop; stop 1 lands on Home, 2–5 on Today)
   ===================================================================== */
document.querySelectorAll('[data-svg]').forEach(function (el) { el.outerHTML = svg(el.dataset.svg, +el.dataset.size || 24, el.className); });
$('#sbDate').textContent = DATES.statusbar;
fit();
setStop((+(params.get('stop') || params.get('moment')) || 1) - 1);
requestAnimationFrame(function () { document.body.classList.add('is-ready'); });

})();
</script>
